    <script>
        lucide.createIcons();

        // ── فرم‌های اختیاری (حذف required) ──
        document.querySelectorAll('.opt-form [required]').forEach(el => el.removeAttribute('required'));

        // ── شمارنده حروف ──
        const goal = document.getElementById('threeMonthGoal');
        const counter = document.getElementById('charCount');
        if (goal && counter) {
            const update = () => counter.textContent = goal.value.length.toLocaleString('en-US');
            goal.addEventListener('input', update);
            update();
        }

        // ── اسلایدر شدت درد فرم ۱ ──
        const painLevel = document.getElementById('painLevel');
        const painValue = document.getElementById('painValue');
        if (painLevel && painValue) {
            const show = () => painValue.textContent = (+painLevel.value).toLocaleString('en-US');
            painLevel.addEventListener('input', show);
            show();
        }

        // ── نمایش شرطی جزئیات درد فرم ۱ ──
        const painBox = document.getElementById('painDetails');
        if (painBox) {
            document.querySelectorAll('input[name="hasPain"]').forEach(radio => {
                radio.addEventListener('change', () => {
                    const yes = document.querySelector('input[name="hasPain"]:checked')?.value === 'بله';
                    painBox.classList.toggle('hidden', !yes);
                });
            });
        }

        // ── نوار پیشرفت اسکرول ──
        const bar = document.getElementById('progressBar');
        addEventListener('scroll', () => {
            const h = document.documentElement;
            const p = h.scrollTop / (h.scrollHeight - h.clientHeight) * 100;
            bar.style.width = p + '%';
        }, { passive: true });

        // ── اعتبارسنجی چک‌باکس‌ها و ارسال فرم ──
        const form = document.getElementById('surveyForm');
        const btn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const requiredGroups = <?= $slug === 'form5' ? '[]' : ($slug === 'form4' ? json_encode([
            ['name' => 'orgGoals[]',  'msg' => 'لطفاً حداقل یک هدف اصلی را انتخاب کنید.'],
            ['name' => 'sports4[]',   'msg' => 'لطفاً حداقل یک نوع ورزش یا «هیچ‌کدام» را انتخاب کنید.'],
            ['name' => 'diseases4[]', 'msg' => 'در بخش بیماری‌ها حداقل یک مورد یا «هیچ‌کدام» را انتخاب کنید.'],
        ], JSON_UNESCAPED_UNICODE) : ($slug === 'form3' ? json_encode([
            ['name' => 'reasons[]', 'msg' => 'لطفاً حداقل یک دلیل برای ادامه همکاری انتخاب کنید.'],
        ], JSON_UNESCAPED_UNICODE) : ($slug === 'form2' ? json_encode([
            ['name' => 'goals2[]',       'msg' => 'لطفاً حداقل یک هدف اصلی مراجعه را انتخاب کنید.'],
            ['name' => 'diseases[]',     'msg' => 'در بخش بیماری‌ها حداقل یک مورد (حتی «هیچ‌کدام») را انتخاب کنید.'],
            ['name' => 'painAreas[]',    'msg' => 'در بخش درد یا آسیب حداقل یک مورد (حتی «ندارم») را انتخاب کنید.'],
            ['name' => 'difficulties[]', 'msg' => 'در بخش فعالیت‌های دشوار حداقل یک مورد (حتی «هیچ‌کدام») را انتخاب کنید.'],
            ['name' => 'services[]',     'msg' => 'لطفاً حداقل یک خدمت مورد نظر را انتخاب کنید.'],
        ], JSON_UNESCAPED_UNICODE) : json_encode([
            ['name' => 'trainPlace[]',     'msg' => 'لطفاً حداقل یک محل تمرین را انتخاب کنید.'],
            ['name' => 'goals[]',          'msg' => 'لطفاً حداقل یک هدف اصلی را انتخاب کنید.'],
            ['name' => 'medicalHistory[]', 'msg' => 'لطفاً در بخش سابقه، حداقل یک مورد (حتی «هیچ‌کدام») را انتخاب کنید.'],
        ], JSON_UNESCAPED_UNICODE)))) ?>;

        if (form && btn) {
            form.addEventListener('submit', (ev) => {
                for (const g of requiredGroups) {
                    if (!form.querySelector(`input[name="${g.name}"]:checked`)) {
                        ev.preventDefault();
                        alert(g.msg);
                        form.querySelector(`input[name="${g.name}"]`)?.closest('fieldset')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        return;
                    }
                }
                const selectedOrgGoals = form.querySelectorAll('input[name="orgGoals[]"]:checked');
                if (selectedOrgGoals.length > 3) {
                    ev.preventDefault();
                    alert('حداکثر سه هدف اصلی قابل انتخاب است.');
                    return;
                }
                const hasPain4 = form.querySelector('input[name="hasPain4"]:checked')?.value === 'بله';
                if (hasPain4 && !form.querySelector('input[name="painAreas4[]"]:checked')) {
                    ev.preventDefault();
                    alert('لطفاً حداقل یک محل درد را انتخاب کنید.');
                    document.getElementById('painDetails4')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    return;
                }
                btn.disabled = true;
                btn.classList.add('opacity-70', 'cursor-wait');
                btnText.textContent = 'در حال ساخت فایل و ذخیره…';
            });
        }

        // ── گزینه انحصاری («هیچ‌کدام» / «ندارم») ──
        function exclusiveOption(groupName, exclusiveValue) {
            const boxes = document.querySelectorAll(`input[name="${groupName}"]`);
            const none  = document.querySelector(`input[name="${groupName}"][value="${exclusiveValue}"]`);
            if (!none) return;
            boxes.forEach(box => {
                box.addEventListener('change', () => {
                    if (box === none && none.checked) {
                        boxes.forEach(b => { if (b !== none) b.checked = false; });
                    } else if (box !== none && box.checked) {
                        none.checked = false;
                    }
                    document.dispatchEvent(new CustomEvent('group-changed', { detail: groupName }));
                });
            });
        }
        exclusiveOption('medicalHistory[]', 'هیچ‌کدام');
        exclusiveOption('diseases[]',       'هیچ‌کدام');
        exclusiveOption('painAreas[]',      'ندارم');
        exclusiveOption('difficulties[]',   'هیچ‌کدام');
        exclusiveOption('sports4[]',        'هیچ‌کدام');
        exclusiveOption('diseases4[]',      'هیچ‌کدام');

        // ── به‌روزرسانی زنده تمام اسلایدرها ──
        [
            ['stressLvl', 'stressValue'], ['water', 'waterValue'], ['fruits', 'fruitsValue'],
            ['progress', 'progressValue'], ['npsScore', 'npsValue'],
            ['painLevel4', 'painLevel4Value'], ['stressLevel4', 'stressLevel4Value'],
            ['satOverall', 'satOverallValue'], ['satCoach', 'satCoachValue'], ['satEquip', 'satEquipValue'],
            ['satClean', 'satCleanValue'], ['satRenew', 'satRenewValue'], ['satNps', 'satNpsValue'],
        ].forEach(([id, out]) => {
            const el = document.getElementById(id), lbl = document.getElementById(out);
            if (el && lbl) {
                const upd = () => lbl.textContent = (+el.value).toLocaleString('en-US');
                el.addEventListener('input', upd); upd();
            }
        });

        document.querySelectorAll('.quality-range').forEach(el => {
            const lbl = document.getElementById(el.dataset.out);
            if (!lbl) return;
            const upd = () => lbl.textContent = (+el.value).toLocaleString('en-US');
            el.addEventListener('input', upd); upd();
        });

        // ── شرطی فرم ۲: باز شدن درد ──
        const painBox2 = document.getElementById('painDetails2');
        if (painBox2) {
            const syncPain = () => {
                const checked = [...document.querySelectorAll('input[name="painAreas[]"]:checked')];
                const hasPain = checked.length > 0 && !checked.some(c => c.value === 'ندارم');
                painBox2.classList.toggle('hidden', !hasPain);
                document.getElementById('painStart')?.toggleAttribute('required', hasPain);
                document.querySelectorAll('input[name="treatment"]').forEach((r, i) => {
                    if (i === 0) r.toggleAttribute('required', hasPain);
                });
            };
            document.querySelectorAll('input[name="painAreas[]"]').forEach(b => b.addEventListener('change', syncPain));
            document.addEventListener('group-changed', syncPain);
            syncPain();
        }

        // ── شرطی فرم ۴: باز شدن درد ──
        const painBox4 = document.getElementById('painDetails4');
        if (painBox4) {
            const syncPain4 = () => {
                const hasPain = document.querySelector('input[name="hasPain4"]:checked')?.value === 'بله';
                painBox4.classList.toggle('hidden', !hasPain);
            };
            document.querySelectorAll('input[name="hasPain4"]').forEach(radio => radio.addEventListener('change', syncPain4));
            syncPain4();
        }

        // ── محدودیت ۳ هدف فرم ۴ ──
        const orgGoalBoxes = document.querySelectorAll('input[name="orgGoals[]"]');
        const orgGoalsHint = document.getElementById('orgGoalsHint');
        if (orgGoalBoxes.length) {
            const updateOrgGoals = (changedBox = null) => {
                let selected = document.querySelectorAll('input[name="orgGoals[]"]:checked');
                if (selected.length > 3 && changedBox) {
                    changedBox.checked = false;
                    alert('حداکثر سه هدف اصلی قابل انتخاب است.');
                    selected = document.querySelectorAll('input[name="orgGoals[]"]:checked');
                }
                if (orgGoalsHint) {
                    orgGoalsHint.textContent = `${selected.length.toLocaleString('en-US')} از ۳ انتخاب شده`;
                }
            };
            orgGoalBoxes.forEach(box => box.addEventListener('change', () => updateOrgGoals(box)));
            updateOrgGoals();
        }

        // ── ریل ناوبری مراحل فرم ──
        if (form) {
            const sections = [...form.querySelectorAll(':scope > section')];
            if (sections.length > 1) {
                const rail = document.createElement('div');
                rail.className = 'step-rail flex flex-col items-center gap-3';
                rail.setAttribute('aria-label', 'مراحل فرم');
                const dots = sections.map(sec => {
                    const d = document.createElement('button');
                    d.type = 'button';
                    d.className = 'step-dot';
                    const title = sec.querySelector('h2')?.textContent.trim() ?? '';
                    if (title) {
                        const tip = document.createElement('span');
                        tip.className = 'tip';
                        tip.textContent = title;
                        d.appendChild(tip);
                    }
                    d.addEventListener('click', () => sec.scrollIntoView({ behavior: 'smooth', block: 'start' }));
                    rail.appendChild(d);
                    return d;
                });
                document.body.appendChild(rail);
                const syncSteps = () => {
                    const mid = innerHeight * .4;
                    let best = 0, dist = Infinity;
                    sections.forEach((s, i) => {
                        const d = Math.abs(s.getBoundingClientRect().top - mid);
                        if (d < dist) { dist = d; best = i; }
                    });
                    dots.forEach((d, i) => d.classList.toggle('active', i === best));
                };
                addEventListener('scroll', syncSteps, { passive: true });
                syncSteps();
            }
        }

        // ── جستجو در پنل مربی ──
        const panelSearch = document.getElementById('panelSearch');
        if (panelSearch) {
            panelSearch.addEventListener('input', () => {
                const q = panelSearch.value.trim();
                document.querySelectorAll('.detail-row').forEach(r => r.classList.add('hidden'));
                document.querySelectorAll('[data-row="sub"]').forEach(row => {
                    const name = row.getAttribute('data-name') || '';
                    row.classList.toggle('hidden', q !== '' && !name.includes(q));
                });
            });
        }
    </script>
</body>
</html>
